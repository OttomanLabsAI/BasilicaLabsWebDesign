<!doctype html>
<!-- The link-preview thumbnail (og:image), 1200 × 630.
     Everything that matters sits in the centre 600 px, so platforms that crop
     to a square (WhatsApp) still show the name and the promise.
     Render: open at exactly 1200 × 630 and screenshot, or see the README. -->
<html lang="en-GB"><head><meta charset="utf-8"><title>Social thumbnail · 1200 × 630</title><style>
@font-face{font-family:'Flux';src:url('../public/assets/fonts/flux.woff2') format('woff2');font-weight:500}
@font-face{font-family:'Instrument Sans';src:url('../public/assets/fonts/instrument-sans-latin.woff2') format('woff2');font-weight:400 700}
@font-face{font-family:'Instrument Serif';src:url('../public/assets/fonts/instrument-serif-latin.woff2') format('woff2')}
:root{--ink:#111114;--ink-2:#1A1B20;--paper:#F6F3EC;--bright:#2DD4A0;--line:rgba(246,243,236,.14)}
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{position:relative;background:var(--ink);color:var(--paper);font-family:'Instrument Sans',sans-serif;font-synthesis:none}
.grid{position:absolute;inset:0;opacity:.6;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:60px 60px;background-position:-31px -31px;-webkit-mask-image:radial-gradient(ellipse 58% 72% at 50% 50%,#000 15%,transparent 78%)}
.glow{position:absolute;width:1000px;height:1000px;left:100px;top:-470px;background:radial-gradient(circle,rgba(16,185,129,.34),rgba(16,185,129,0) 60%)}
.frame{position:absolute;width:430px;border-radius:14px;overflow:hidden;background:var(--ink-2);border:1px solid var(--line);box-shadow:0 40px 90px -30px #000}
.frame .bar{display:flex;align-items:center;gap:6px;padding:9px 11px;border-bottom:1px solid var(--line)}
.frame .bar i{width:8px;height:8px;border-radius:50%;background:#2B2C33}
.frame .bar span{margin-left:6px;font:500 11px/1 ui-monospace,Menlo,monospace;color:#A9ABB2;background:rgba(255,255,255,.06);border-radius:99px;padding:5px 9px}
.frame img{display:block;width:100%}
.frame.l{left:-185px;top:168px;transform:rotate(-7deg)}
.frame.r{right:-185px;top:136px;transform:rotate(7deg)}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(17,17,20,.55),rgba(17,17,20,0) 26%,rgba(17,17,20,0) 74%,rgba(17,17,20,.55))}
.center{position:absolute;left:290px;width:620px;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.logo{display:inline-flex;flex-direction:column;align-items:center;line-height:1}
.logo .w{font:500 42px/1 'Flux'}
.logo .d{font:400 28px/1 'Instrument Serif';letter-spacing:.01em;color:var(--bright);margin-top:3px}
h1{font:500 84px/.97 'Flux';letter-spacing:-.02em;margin-top:34px}
h1 span{color:var(--bright);white-space:nowrap}
.chips{display:flex;gap:8px;margin-top:32px}
.chips b{font:500 17px/1 'Instrument Sans';border:1px solid rgba(246,243,236,.26);background:rgba(17,17,20,.7);border-radius:99px;padding:10px 14px;white-space:nowrap}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<div class="frame l"><div class="bar"><i></i><i></i><i></i><span>https://visualneuroscience.ai</span></div><img src="../public/assets/img/work/visual-neuroscience-800.webp" alt=""></div>
<div class="frame r"><div class="bar"><i></i><i></i><i></i><span>https://tiatandyrugby.com</span></div><img src="../public/assets/img/work/tia-tandy-800.webp" alt=""></div>
<div class="shade"></div>
<div class="center">
  <div class="logo"><span class="w">BasilicaLabs</span><span class="d">Web Design</span></div>
  <h1>Your new website,<br><span>live today.</span></h1>
  <div class="chips"><b>Live the same day</b><b>Try before you buy</b><b>Free hosting, forever</b></div>
</div>
</body></html>
